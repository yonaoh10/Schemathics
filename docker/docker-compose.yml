# Local stand-in for the Databricks workspace.
#
#   mlflow      tracking server + model registry   (Databricks: the workspace itself)
#   train       one-shot training run              (Databricks: a Job task)
#   scheduler   weekly Sunday 05:00 retrain        (Databricks: the Job's schedule)
#   api         the serving endpoint               (Databricks: a Model Serving endpoint)
#
#   docker compose -f docker/docker-compose.yml up mlflow -d
#   docker compose -f docker/docker-compose.yml run --rm train --mode production
#   docker compose -f docker/docker-compose.yml up api -d
#
# The repository is bind-mounted so data/, runs/ and mlruns/ survive container restarts
# and can be inspected from the host.

name: bl-ranking

services:

# Default backend note: neither image installs the `tabpfn` extra (torch is ~2.5 GB), so
# `tabpfn_local` cannot be constructed in them. The default below is the one backend that
# always works offline. Override it for the *training* services with, e.g.
#   BL_PAYOUT_BACKEND=tabpfn_client TABPFN_TOKEN=... docker compose up
# which is training and scheduler only - api reads BL_SERVING_PAYOUT_BACKEND, on purpose,
# for the reason spelled out on that service below.
#
# The serving image installs the `serve` extra, which has no TabPFN of either kind. A
# bundle trained with tabpfn_client therefore degrades to catboost_fallback when this image
# loads it, rather than failing: the funnel's synchronous path keeps answering, and every
# response carries `payout_backend`, so a degraded endpoint says so on every request. Add
# tabpfn-client to the `serve` extra if exact hosted payouts are wanted at serve time -
# and note that it puts a network call on the request path.

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --serve-artifacts
    ports: ["5000:5000"]
    volumes:
      - ../mlruns:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  train:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: training
    depends_on:
      mlflow: {condition: service_healthy}
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TABPFN_TOKEN: ${TABPFN_TOKEN:-}
      BL_MODEL__PAYOUT__BACKEND: ${BL_PAYOUT_BACKEND:-catboost_fallback}
      # Register (and move the serving alias) under the same names the API resolves, so
      # setting these in .env keeps training and serving pointed at one model. Defaults
      # match conf/config.yaml.
      BL_MLFLOW__REGISTERED_MODEL: ${BL_MLFLOW__REGISTERED_MODEL:-bl_brand_ranker}
      BL_MLFLOW__SERVING_ALIAS: ${BL_MLFLOW__SERVING_ALIAS:-champion}
    volumes:
      - ..:/app
    # Overridden on the command line, e.g. `run --rm train --mode production`.
    command: ["python", "-m", "bl_ranking.training.job", "--mode", "train_test"]

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: training
    depends_on:
      mlflow: {condition: service_healthy}
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TABPFN_TOKEN: ${TABPFN_TOKEN:-}
      BL_MODEL__PAYOUT__BACKEND: ${BL_PAYOUT_BACKEND:-catboost_fallback}
      # Register (and move the serving alias) under the same names the API resolves, so
      # setting these in .env keeps training and serving pointed at one model. Defaults
      # match conf/config.yaml.
      BL_MLFLOW__REGISTERED_MODEL: ${BL_MLFLOW__REGISTERED_MODEL:-bl_brand_ranker}
      BL_MLFLOW__SERVING_ALIAS: ${BL_MLFLOW__SERVING_ALIAS:-champion}
    volumes:
      - ..:/app
    command: ["python", "-m", "bl_ranking.ops.schedule"]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: serving
    depends_on:
      mlflow: {condition: service_healthy}
    ports: ["8080:8080"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TABPFN_TOKEN: ${TABPFN_TOKEN:-}
      # A *different* variable from the training services above, and empty by default.
      #
      # Serving reads the backend from the bundle it loaded unless an operator asked for
      # a different one, so that a rollback carries the backend its version was built
      # with. Pinning a default here made that second tier unreachable in every shipped
      # deployment: a rolled-back surrogate bundle would have been served by the fallback
      # regressor instead, silently and with a different ranking. An empty variable counts
      # as unset (see config.env_override_keys), so the bundle wins.
      #
      # Sharing BL_PAYOUT_BACKEND with the training services would undo that the moment
      # anyone set it - and .env.example sets it, because training does want a default.
      BL_MODEL__PAYOUT__BACKEND: ${BL_SERVING_PAYOUT_BACKEND:-}
      # Which registered model and alias this worker resolves. Interpolated from the
      # environment so .env can actually change them - they were documented in .env.example
      # but referenced by no service, so an operator canarying with SERVING_ALIAS=challenger
      # got a container still resolving @champion while GET /model looked healthy. Defaults
      # match conf/config.yaml.
      BL_MLFLOW__REGISTERED_MODEL: ${BL_MLFLOW__REGISTERED_MODEL:-bl_brand_ranker}
      BL_MLFLOW__SERVING_ALIAS: ${BL_MLFLOW__SERVING_ALIAS:-champion}
      BL_SERVING__WORKERS: ${BL_SERVING_WORKERS:-3}
      BL_SERVING__THREADS_PER_WORKER: "1"
      # Where the workers share their Prometheus counters, so one scrape covers all three
      # instead of the one that answered it (scripts/serve.sh sets this up). Deliberately
      # outside the /app bind mount: the files are named by pid, and the host's pids are
      # not the container's, so a shared directory would merge two unrelated processes.
      PROMETHEUS_MULTIPROC_DIR: /tmp/bl-metrics
    volumes:
      - ..:/app
    # Each worker holds its own copy of the model and the gender table: ~634 MB resident
    # measured warm, so three workers come to about 1.9 GB. Sized for that with headroom;
    # raise alongside BL_SERVING__WORKERS.
    mem_limit: 4g
    restart: unless-stopped
